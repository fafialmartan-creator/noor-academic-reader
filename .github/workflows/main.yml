name: Build Noor Academic Reader
on: [push, workflow_dispatch]
jobs:
build:
runs-on: ubuntu-latest
steps:
- uses: actions/checkout@v4
- uses: actions/setup-java@v4
with:
distribution: temurin
java-version: 17
- uses: subosito/flutter-action@v2
with:
flutter-version: 3.24.0
cache: true
- name: Generate and Build Noor App
run: |
rm -rf build_dir
flutter create --org com.noor.reader --project-name noor_academic_reader build_dir
rm -f build_dir/test/widget_test.dart
cp lib/main.dart build_dir/lib/main.dart
cd build_dir
for i in 1 2 3 4 5; do flutter build apk --debug && break || sleep 10; done
- uses: actions/upload-artifact@v4
with:
name: noor-academic-reader-apk
path: build_dir/build/app/outputs/flutter-apk/app-debug.apk
