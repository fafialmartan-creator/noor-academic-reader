name: Build Noor Academic Reader APK
​on:
push:
branches: [ "main" ]
workflow_dispatch:
​jobs:
build:
name: Build Android APK
runs-on: ubuntu-latest
​steps:
- name: Checkout Repository
uses: actions/checkout@v4
​- name: Setup Java 17
uses: actions/setup-java@v4
with:
distribution: 'temurin'
java-version: '17'
​- name: Setup Flutter
uses: subosito/flutter-action@v2
with:
flutter-version: '3.24.0'
channel: 'stable'
​- name: Initialize Flutter Project if Missing
run: |
if [ ! -f "pubspec.yaml" ]; then
flutter create --org com.noor.reader --project-name noor_academic_reader .
fi
​- name: Install Dependencies
run: flutter pub get
​- name: Build Debug APK for Testing
run: flutter build apk --debug
​- name: Upload APK Artifact
uses: actions/upload-artifact@v4
with:
name: noor-academic-reader-apk
path: build/app/outputs/flutter-apk/app-debug.apk
